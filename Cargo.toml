[package]
name = "aodv"
version = "0.2.0"
edition = "2024"
description = "Userspace AODV control-plane implementation based on RFC 3561"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Fierthraix/aodv-rs"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tempfile = "3"
